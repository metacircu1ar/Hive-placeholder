[package]
name = "hive-log"
version.workspace = true
edition = "2024"
license = "MIT"
rust-version = "1.89"
description = "Bounded structured diagnostics for Hive tools"
publish = false

[dependencies]
atomic-fs = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
tracing-log = "0.2"
log = "0.4"
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
