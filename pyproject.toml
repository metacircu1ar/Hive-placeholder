[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Standalone unittest modules add scripts/ to sys.path before importing its helpers.
"tests/test_release_packaging.py" = ["E402"]
"tests/test_runtime_provider.py" = ["E402"]
# The Rust auth fixture prepends these runtime bindings to the executable.
"tests/fixtures/provider.py" = ["F821"]
