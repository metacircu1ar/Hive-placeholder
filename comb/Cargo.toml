[package]
name = "comb"
version.workspace = true
edition = "2024"
license = "MIT"
rust-version = "1.89"
description = "Shared local knowledge for Hive agents"
publish = false

[dependencies]
hive-input = { path = "../input", features = ["clap"] }
atomic-fs = "0.1"
hive-log = { path = "../logging" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
hive-setup-support = { path = "../setup-support" }
comb-protocol = { path = "../comb-protocol" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.38", features = ["bundled", "serialize"] }
hashlink = "0.11.1"
getrandom = { version = "0.4", features = ["std"] }
sha2 = "0.10.9"
sha1 = "=0.10.6"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
pulldown-cmark = "0.13"
tempfile = "3"
thiserror = "2"
libc = "0.2"
rustix = { version = "1.1.5", features = ["fs", "process", "net", "event"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros", "signal"] }

tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

[dev-dependencies]
comb-protocol = { path = "../comb-protocol", features = ["test-support"] }

[lints]
workspace = true
